name: Monitor official YiXianPai numerical rules
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'cloud_rules_*.py'
      - 'registry.json'
      - 'tests/**'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: verified-numeric-rules
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify supported template contracts
        run: python3 -m unittest discover -s tests -v
      - name: Check official announcements and registered Wiki faces
        run: python3 cloud_rules_publisher.py --folder .
      - name: Recheck complete data candidate
        run: python3 -m unittest discover -s tests -v
      - name: Publish validated data and monitor status
        run: |
          git config user.name 'yxp-rules-monitor'
          git config user.email 'yxp-rules-monitor@users.noreply.github.com'
          git add public
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified numeric rules and source status'
            git push
          fi
